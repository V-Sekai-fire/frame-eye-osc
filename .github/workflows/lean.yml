name: lean

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools from apt
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build
      - name: Slang
        # tests/lakefile.lean turns src/core.slang into C++ with slangc. Pinned to the version this was written against.
        run: |
          curl -sSfL https://github.com/shader-slang/slang/releases/download/v2026.13/slang-2026.13-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/slangc" -v
      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (tests)
        working-directory: tests
        run: |
          lake build FrameEyeOscTests tests
